[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-runtime"
version = "0.1.0"
description = "A small, permissioned runtime for coding agents."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coding-agent = "coding_agent_runtime.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["coding_agent_runtime*"]
